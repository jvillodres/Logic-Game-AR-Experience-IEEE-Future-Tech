<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.png">
  <title>La Misión Espacial</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Game systems (load first — no DOM dependency) -->
  <script src="src/systems/game-state.js"></script>
  <script src="src/systems/timer.js"></script>

  <!-- A-Frame components -->
  <script src="src/components/battery-pickup.js"></script>
  <script src="src/components/and-gate-logic.js"></script>

  <!-- UI controllers -->
  <script src="src/ui/hud.js"></script>
  <script src="src/ui/inventory.js"></script>
  <script src="src/ui/logic-helper.js"></script>

  <link rel="stylesheet" href="src/ui/hud.css" />
</head>
<body>
  <!--
    Router: loads the correct level scene into #level-mount.
    In a real build (Vite) you'd use dynamic import() or
    fetch() + innerHTML.  For now a simple hash-router works.
  -->
  <div id="level-mount"></div>

   <script>
    const routes = {
      '#level1': 'src/levels/level1-and.html',
      '#level2': 'src/levels/level2-or.html',
      '#level3': 'src/levels/level3-not.html',
      '#level4': 'src/levels/level4-combined.html',
    };
 
    /**
     * innerHTML silently drops <script> tags — the browser won't execute them.
     * This helper re-creates each script as a real DOM element so they run.
     */
    function injectHTML(container, html) {
      // 1. Wipe previous level (stops old timers via their own cleanup if any)
      container.innerHTML = '';
 
      // 2. Parse the incoming HTML string
      const doc = new DOMParser().parseFromString(html, 'text/html');
 
      // 3. Clone every node from <body> into the container
      //    For <script> nodes we must create a fresh element — cloneNode won't execute them
      Array.from(doc.body.childNodes).forEach(node => {
        if (node.nodeName === 'SCRIPT') {
          const s = document.createElement('script');
          // Copy attributes (type, src, defer, etc.)
          Array.from(node.attributes).forEach(a => s.setAttribute(a.name, a.value));
          s.textContent = node.textContent;
          container.appendChild(s);         // ← this triggers execution
        } else {
          container.appendChild(document.importNode(node, true));
        }
      });
 
      // 4. Also pull any <style> blocks from <head> (level-local CSS)
      Array.from(doc.head.querySelectorAll('style')).forEach(node => {
        const s = document.createElement('style');
        s.textContent = node.textContent;
        container.appendChild(s);
      });
    }
 
    async function navigate(hash) {
      const path = routes[hash] || routes['#level1'];
      try {
        const res  = await fetch(path);
        if (!res.ok) throw new Error(`HTTP ${res.status} loading ${path}`);
        const html = await res.text();
        injectHTML(document.getElementById('level-mount'), html);
      } catch (err) {
        console.error('[Router]', err);
      }
    }
 
    window.addEventListener('hashchange', () => navigate(location.hash));
    navigate(location.hash || '#level1');
  </script>
</body>
</html>
